name: Refresh AWS user-group directory
on:
  schedule:
    - cron: '23 10 1 * *'
  push:
    paths:
      - '.github/workflows/refresh-community-directory.yml'
      - 'scripts/directory-sync/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: community-directory-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install directory tools
        run: npm ci --prefix scripts/directory-sync
      - name: Install browser
        working-directory: scripts/directory-sync
        run: npx playwright install --with-deps chromium
      - name: Refresh every directory page
        run: node scripts/directory-sync/refresh.mjs
      - name: Commit updated catalogue
        run: |
          if git diff --quiet -- src/data/community-directory.json; then
            echo "No directory changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/community-directory.json
          git commit -m "Refresh AWS user-group directory"
          git push
